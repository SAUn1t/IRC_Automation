name: Windows installer release v1.0.22

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-1-0-22.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check release version
        shell: pwsh
        run: |
          $version = python -c "import ircenter_automation; print(ircenter_automation.__version__)"
          if ($version -ne "1.0.22") { throw "Expected app version 1.0.22, got $version" }
          $extensionVersion = python -c "import ircenter_automation; print(ircenter_automation.EXTENSION_VERSION)"
          $manifestVersion = (Get-Content chrome_extension/manifest.json | ConvertFrom-Json).version
          if ($extensionVersion -ne $manifestVersion) { throw "Chrome extension version does not match the app" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Could not upgrade pip" }
          python -m pip install --requirement requirements.txt pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "Could not install build dependencies" }
      - name: Install Chromium for tests and packaged browser mode
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD "playwright-browsers"
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Could not install Chromium" }
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
          node tests/extension_background.test.js
          if ($LASTEXITCODE -ne 0) { throw "Chrome extension tests failed" }
      - name: Bundle application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name IRCenterAssistant --collect-all playwright --add-data "config;config" app.py
          if ($LASTEXITCODE -ne 0) { throw "Application bundle failed" }
          Copy-Item chrome_extension dist/IRCenterAssistant/chrome_extension -Recurse
          Copy-Item playwright-browsers dist/IRCenterAssistant/playwright-browsers -Recurse
          & dist/IRCenterAssistant/IRCenterAssistant.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged application self-test failed" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $compiler "/DAppVersion=$env:APP_VERSION" "packaging/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (-not (Test-Path "dist-installer/IRCenterAssistant-Setup.exe")) { throw "Installer is missing" }
          Get-FileHash "dist-installer/IRCenterAssistant-Setup.exe" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: IRCenterAssistant-Windows
          path: dist-installer/IRCenterAssistant-Setup.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/IRCenterAssistant-Setup.exe
          tag_name: v1.0.22
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
